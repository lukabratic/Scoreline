[project]
name = "scoreline-backend"
version = "0.1.0"
description = "Scoreline API and data pipeline"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.6",
    "python-dotenv>=1.0",
    "requests>=2.32",
    "nba_api>=1.5",
]

[tool.uv]
package = false
